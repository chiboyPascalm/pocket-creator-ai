name: Build Pocket Creator AI binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x86_64
            runner: macos-15-intel
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: windows-x86_64
            runner: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build and test native binary
        run: python executas/creator-ai/package_binary.py

      - name: Upload platform archive
        uses: actions/upload-artifact@v4
        with:
          name: creator-ai-${{ matrix.platform }}
          path: executas/creator-ai/dist-anna/**
          if-no-files-found: error
          retention-days: 14

  combine:
    name: Combine all platform archives
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: creator-ai-*
          path: combined
          merge-multiple: true

      - name: Verify four archives exist
        shell: bash
        run: |
          find combined -type f -print
          test "$(find combined -type f | wc -l)" -eq 4

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-creator-ai-binaries
          path: combined/**
          if-no-files-found: error
          retention-days: 14
